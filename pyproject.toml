[project]
name = "chitchat-nao"
version = "0.1.0"
description = "Making the Nao6 robot smarter with machine learning and natural language processing."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "llama-cpp-python>=0.3.28",
    "numpy>=2.4.6",
    "pyaudio>=0.2.14",
    "sentence-transformers>=5.1.2",
    "webrtcvad-wheels>=2.0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chitchat_nao"]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]
